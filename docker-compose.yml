version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9092:9092"
    environment:
      - MOCK_DATABASE=True
      - SQL_SERVER=127.0.0.1
      - SQL_DATABASE=MOCK_DB
      - SQL_USER=demo_user
      - SQL_PWD=demo_password
      - SQL_DRIVER=ODBC Driver 17 for SQL Server
      - DB_NAME=persistence.db
      - ML_MODEL_PATH=backend/ml/models/waste_predictor.joblib
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "9091:80"
    depends_on:
      - backend
    restart: always
